upstream fastcgi_backend {
    server app:9000;
}

server {
    listen 80;
    server_name _; # accept any host (Codespaces tunnels)

    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;

    root $MAGE_ROOT/pub;
    index index.php index.html;

    client_max_body_size 20M;
    fastcgi_read_timeout 600;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location /static/ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;
        expires max;
        add_header Cache-Control "public";
    }

    location /media/ {
        try_files $uri $uri/ /get.php?$args;
        expires max;
        add_header Cache-Control "public";
    }

    location ~* \.php|phtml$ {
        # Prefer forwarded host if present (Codespaces proxy)
        set $real_host $http_x_forwarded_host;
        if ($real_host = "") { set $real_host $http_host; }
        try_files $uri =404;
        fastcgi_pass fastcgi_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $https;
        fastcgi_param HTTP_HOST $real_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_HOST $real_host;
        fastcgi_param PHP_VALUE "memory_limit=2G\nmax_execution_time=1800";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|eot|ttf|woff|woff2)$ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;
        expires max;
        add_header Cache-Control "public";
    }
}
